<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>윤다연 소개</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #fdf0f5;
      color: #4a4a5a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 680px;
      width: 90%;
      padding: 60px 40px;
      background: #fff8fb;
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(200, 150, 180, 0.12);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c9b8e8, #f9c6d8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      color: #5a4a6a;
    }

    .subtitle {
      font-size: 1rem;
      color: #b09ab8;
      margin-bottom: 36px;
      letter-spacing: 0.02em;
    }

    .divider {
      border: none;
      border-top: 1px solid #f0d8e8;
      margin-bottom: 32px;
    }

    .bio {
      font-size: 1rem;
      line-height: 1.8;
      color: #7a6a82;
      margin-bottom: 36px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 40px;
    }

    .tag {
      background: #f3e8f7;
      color: #9b7bb8;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .contact {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: #8a7a92;
    }

    .contact-item .icon {
      font-size: 1.1rem;
      width: 24px;
      text-align: center;
    }

    .contact-item a {
      color: #b089c8;
      text-decoration: none;
    }

    .contact-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">👋</div>

    <h1>안녕하세요.<br>윤다연입니다.</h1>
    <p class="subtitle">개발자 · 교사 · 창작자</p>

    <hr class="divider" />

    <p class="bio">
      새로운 것을 배우고 만드는 것을 좋아합니다.<br>
      코드 한 줄, 디자인 한 획에 진심을 담아 작업합니다.<br>
      함께 성장할 수 있는 사람들과 일하고 싶습니다.
    </p>

    <div class="tags">
      <span class="tag">#웹개발</span>
      <span class="tag">#UI/UX</span>
      <span class="tag">#창작</span>
      <span class="tag">#독서</span>
      <span class="tag">#커피</span>
    </div>

    <div class="contact">
      <div class="contact-item">
        <span class="icon">📧</span>
        <span>이메일: <a href="mailto:dayeont001@e-mirim.hs.kr">dayeont001@e-mirim.hs.kr</a></span>
      </div>
      <div class="contact-item">
        <span class="icon">🔗</span>
        <span>GitHub: <a href="https://github.com/codingnakta/" target="_blank">https://github.com/codingnakta</a></span>
      </div>
      <div class="contact-item">
        <span class="icon">📍</span>
        <span>서울, 대한민국</span>
      </div>
    </div>
  </div>
</body>
</html>
